name: Build and Deploy PWA

on:
  push:
    branches:
      - main # Triggers the workflow on push to the main branch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-level: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Changes to 'yarn' or 'pnpm' if needed

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build # Ensures your build script generates the service worker

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Change to ./build or ./out depending on your framework

  deploy:
    environment:
      name: github-pages
      url: ${{ steps:deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
